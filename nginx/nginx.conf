user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Log format tracking which Gateway instance receives and handles the request
    log_format gateway_tracking '$remote_addr - [$time_local] "$request" status=$status '
                               'routed_to=[ip=$upstream_addr instance=$upstream_http_x_gateway_instance status=$upstream_status] '
                               'rt=${request_time}s urt=${upstream_response_time}s';

    access_log /var/log/nginx/access.log gateway_tracking;

    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 10M;

    # Docker embedded DNS resolver (dynamic service discovery)
    resolver 127.0.0.11 valid=2s ipv6=off;

    server {
        listen 80;
        server_name localhost;

        location / {
            # Use variable so Nginx dynamically re-resolves via 127.0.0.11
            set $api_gateway_backend "http://api-gateway:3000";
            proxy_pass $api_gateway_backend;

            # HTTP 1.1 support
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            # Forward proxy headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Timeouts
            proxy_connect_timeout 2s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;

            # Expose routed upstream IP to client header for easy tracking
            add_header X-Handled-By-Upstream $upstream_addr always;
        }
    }
}
